[package]
name = "cpr-excel-companion-plugin"
version = "0.8.0"
edition = "2024"
license = "Unlicense"
publish = false
[dependencies]
cpr-excel-companion = { path = ".." }
gateway-plugin-sdk = { path = "../vendor/gateway-plugin-sdk", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-std", "net", "time"] }
sha2 = "0.10"
hex = "0.4"
