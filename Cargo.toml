[package]
name = "cpr-excel-companion"
version = "0.8.0"
edition = "2024"
license = "Unlicense"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
async-stream = "0.3"
hmac = "0.12"
zstd = { version = "0.13", default-features = false }

[workspace]
members = ["plugin"]
